name: Refresh portfolio news feed

on:
  schedule:
    # 03:30 UTC = 09:00 IST, after the morning BusinessLine feeds settle.
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: portfolio-news-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install feed dependencies
        run: pip install "requests>=2.32" "beautifulsoup4>=4.12"

      - name: Build sanitized public feed
        run: python portfolio/update_news.py

      - name: Commit changed feed
        run: |
          if git diff --quiet -- portfolio/news.json; then
            echo "The public feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/news.json
          git commit -m "Refresh Daily News Brief"
          git push
